{% extends "base.html" %}

{% block content %}
    <div class="form-container">
        <h2>Exporter les Transactions</h2>

        <form method="POST" action="{{ url_for('main.export') }}">
            <div class="form-group">
                <label for="start_date">Date de début (Optionnel):</label><br>
                <input type="date" id="start_date" name="start_date">
            </div>
            <div class="form-group">
                <label for="end_date">Date de fin (Optionnel):</label><br>
                <input type="date" id="end_date" name="end_date">
            </div>
            <div class="form-group">
                <label for="format">Format d'export:</label><br>
                <select id="format" name="format">
                    <option value="pdf">PDF</option>
                    <option value="excel">Excel (.xlsx)</option>
                </select>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Exporter</button>
            </div>
        </form>
    </div>
{% endblock %}
